<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f0ee;
      --paper: #ffffff;
      --ink: #1d3436;
      --muted: #5f7a78;
      --accent: #1f7a5c;
      --accent-soft: #d3ebe2;
      --danger: #b4443a;
      --line: #cfdcd9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      line-height: 1.5;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .summary {
      color: var(--muted);
      margin-top: 6px;
    }

    .lang-toggle {
      display: flex;
      border: 2px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lang-toggle button {
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 500;
      padding: 6px 14px;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: var(--ink);
      color: #fff;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    form input {
      flex: 1;
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
    }

    form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-add {
      font: inherit;
      font-weight: 700;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .btn-add:hover { background: #18654c; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filters button {
      font: inherit;
      font-size: 0.9rem;
      padding: 4px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .filters button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    ul {
      list-style: none;
      background: var(--paper);
      border-radius: 12px;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    li .text {
      flex: 1;
      word-break: break-word;
    }

    li.done .text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .btn-delete {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: #f6e3e1;
    }

    .btn-edit,
    .btn-cancel {
      font: inherit;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 2px 10px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-edit:hover,
    .btn-cancel:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-save {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 3px 12px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-save:hover { background: #18654c; }

    .edit-input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 4px 8px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      color: var(--ink);
    }

    li.editing { background: var(--accent-soft); }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-clear {
      font: inherit;
      font-size: 0.9rem;
      border: none;
      background: none;
      color: var(--danger);
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-clear:disabled {
      color: var(--line);
      cursor: default;
      text-decoration: none;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 420px) {
      h1 { font-size: 2rem; }
      header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1 data-i18n="title"></h1>
        <p class="summary" id="summary"></p>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="bn">বাংলা</button>
      </div>
    </header>

    <form id="taskForm">
      <input id="taskInput" type="text" autocomplete="off" maxlength="200" />
      <button class="btn-add" type="submit" data-i18n="add"></button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all" data-i18n="all"></button>
      <button type="button" data-filter="active" data-i18n="active"></button>
      <button type="button" data-filter="done" data-i18n="completed"></button>
    </div>

    <ul id="taskList"></ul>

    <footer>
      <button class="btn-clear" id="clearDone" type="button" data-i18n="clearDone"></button>
    </footer>
  </main>

  <script>
    const TASKS_KEY = "todo-tasks";
    const LANG_KEY = "todo-lang";

    const translations = {
      en: {
        title: "My Tasks",
        placeholder: "What do you need to do?",
        add: "Add",
        all: "All",
        active: "Active",
        completed: "Completed",
        clearDone: "Clear completed",
        delete: "Delete task",
        edit: "Edit",
        editLabel: "Edit task text",
        save: "Save",
        cancel: "Cancel",
        emptyAll: "No tasks yet. Add your first one above.",
        emptyActive: "Nothing left to do.",
        emptyDone: "No completed tasks yet.",
        summary: (left, total) =>
          total === 0 ? "Your list is empty" : `${left} of ${total} left to do`
      },
      bn: {
        title: "আমার কাজ",
        placeholder: "কী করতে হবে লিখুন",
        add: "যোগ করুন",
        all: "সব",
        active: "বাকি",
        completed: "সম্পন্ন",
        clearDone: "সম্পন্ন কাজ মুছুন",
        delete: "কাজ মুছুন",
        edit: "এডিট",
        editLabel: "কাজের লেখা বদলান",
        save: "সেভ",
        cancel: "বাতিল",
        emptyAll: "এখনো কোনো কাজ নেই। উপরে প্রথম কাজটি যোগ করুন।",
        emptyActive: "আর কোনো কাজ বাকি নেই।",
        emptyDone: "এখনো কোনো কাজ সম্পন্ন হয়নি।",
        summary: (left, total) =>
          total === 0 ? "তালিকা খালি" : `${total}টির মধ্যে ${left}টি কাজ বাকি`
      }
    };

    // Load saved data (safe if storage is empty or broken)
    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        /* storage full or disabled */
      }
    }

    let tasks = load(TASKS_KEY, []);
    let lang = load(LANG_KEY, "en");
    let filter = "all";
    let editingId = null; // id of the task currently being edited

    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const summary = document.getElementById("summary");
    const clearBtn = document.getElementById("clearDone");

    // Convert digits to Bangla numerals when Bangla is selected
    function num(n) {
      if (lang !== "bn") return String(n);
      return String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    }

    function t(key) {
      return translations[lang][key];
    }

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      input.placeholder = t("placeholder");
      document.querySelectorAll("[data-lang]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      render();
    }

    function render() {
      const visible = tasks.filter(task =>
        filter === "active" ? !task.done :
        filter === "done" ? task.done : true
      );

      list.innerHTML = "";

      if (visible.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent =
          filter === "active" ? t("emptyActive") :
          filter === "done" ? t("emptyDone") : t("emptyAll");
        list.appendChild(empty);
      }

      visible.forEach(task => {
        const li = document.createElement("li");

        // Edit mode: text input + Save + Cancel
        if (task.id === editingId) {
          li.classList.add("editing");

          const editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = task.text;
          editInput.maxLength = 200;
          editInput.setAttribute("aria-label", t("editLabel"));
          editInput.addEventListener("keydown", e => {
            if (e.key === "Enter") saveEdit(task.id, editInput.value);
            if (e.key === "Escape") cancelEdit();
          });

          const saveBtn = document.createElement("button");
          saveBtn.type = "button";
          saveBtn.className = "btn-save";
          saveBtn.textContent = t("save");
          saveBtn.addEventListener("click", () => saveEdit(task.id, editInput.value));

          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn-cancel";
          cancelBtn.textContent = t("cancel");
          cancelBtn.addEventListener("click", cancelEdit);

          li.append(editInput, saveBtn, cancelBtn);
          list.appendChild(li);

          // Focus and put cursor at the end
          setTimeout(() => {
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
          }, 0);
          return;
        }

        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", task.text);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = task.text;

        const del = document.createElement("button");
        del.className = "btn-delete";
        del.type = "button";
        del.innerHTML = "&times;";
        del.title = t("delete");
        del.setAttribute("aria-label", t("delete"));
        del.addEventListener("click", () => deleteTask(task.id));

        const edit = document.createElement("button");
        edit.className = "btn-edit";
        edit.type = "button";
        edit.textContent = t("edit");
        edit.setAttribute("aria-label", `${t("edit")}: ${task.text}`);
        edit.addEventListener("click", () => startEdit(task.id));

        // Double-click the text to edit too
        text.addEventListener("dblclick", () => startEdit(task.id));

        li.append(checkbox, text, edit, del);
        list.appendChild(li);
      });

      const total = tasks.length;
      const left = tasks.filter(task => !task.done).length;
      summary.textContent = t("summary")(num(left), num(total));
      clearBtn.disabled = tasks.every(task => !task.done);

      document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
    }

    function addTask(text) {
      tasks.unshift({ id: Date.now(), text, done: false });
      save(TASKS_KEY, tasks);
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
      save(TASKS_KEY, tasks);
      render();
    }

    function startEdit(id) {
      editingId = id;
      render();
    }

    function cancelEdit() {
      editingId = null;
      render();
    }

    function saveEdit(id, newText) {
      const text = newText.trim();
      // Empty text keeps the old text instead of saving a blank task
      if (text) {
        tasks = tasks.map(task => task.id === id ? { ...task, text } : task);
        save(TASKS_KEY, tasks);
      }
      editingId = null;
      render();
    }

    function deleteTask(id) {
      if (editingId === id) editingId = null;
      tasks = tasks.filter(task => task.id !== id);
      save(TASKS_KEY, tasks);
      render();
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTask(text);
      input.value = "";
      input.focus();
    });

    clearBtn.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      save(TASKS_KEY, tasks);
      render();
    });

    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        render();
      });
    });

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        save(LANG_KEY, lang);
        applyLanguage();
      });
    });

    applyLanguage();
  </script>
</body>
</html>
